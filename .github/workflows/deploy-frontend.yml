name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
    - 'kleeBunko_Front/**' # Solo se ejecuta si cambia algo en la carpeta del front

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./kleeBunko_Front # Todas las órdenes se ejecutan aquí
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'kleeBunko_Front/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build
      env:
        # Inyecta la URL de tu backend en producción como variable de entorno
        VITE_API_URL: ${{ secrets.VITE_API_URL }}

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './kleeBunko_Front/dist' # La ruta al build de Vite

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
